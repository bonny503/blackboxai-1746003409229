<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us | SecureCCTV - Get a Free Quote or Support</title>
  <meta name="description" content="Contact SecureCCTV for inquiries, free quotes, and support. Reach us by phone, email, or through our contact form." />
  <meta name="keywords" content="CCTV contact, CCTV quote request, CCTV support, security camera inquiries, CCTV service area" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-['Roboto'] text-gray-800">
  <header class="bg-white shadow">
    <div class="container mx-auto flex justify-between items-center p-4">
      <a href="index.html" class="text-2xl font-bold text-blue-700">SecureCCTV</a>
      <nav class="space-x-6 text-gray-700 hidden md:flex">
        <a href="index.html" class="hover:text-blue-700">Home</a>
        <a href="products.html" class="hover:text-blue-700">Products</a>
        <a href="installation.html" class="hover:text-blue-700">Installation</a>
        <a href="blog.html" class="hover:text-blue-700">Blog</a>
        <a href="about.html" class="hover:text-blue-700">About Us</a>
        <a href="contact.html" class="hover:text-blue-700 font-semibold border-b-2 border-blue-700">Contact</a>
      </nav>
      <div class="md:hidden">
        <button id="menu-btn" aria-label="Toggle menu" class="text-gray-700 focus:outline-none">
          <i class="fas fa-bars fa-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 py-12 max-w-4xl">
    <h1 class="text-3xl font-bold mb-6">Contact SecureCCTV</h1>

    <section class="mb-8">
      <h2 class="text-2xl font-semibold mb-4">Get in Touch</h2>
      <form id="contact-form" class="bg-white p-6 rounded-lg shadow space-y-4" action="#" method="POST">
        <div>
          <label for="name" class="block font-semibold mb-1">Name</label>
          <input type="text" id="name" name="name" required class="w-full border border-gray-300 rounded px-3 py-2" />
        </div>
        <div>
          <label for="email" class="block font-semibold mb-1">Email</label>
          <input type="email" id="email" name="email" required class="w-full border border-gray-300 rounded px-3 py-2" />
        </div>
        <div>
          <label for="message" class="block font-semibold mb-1">Message</label>
          <textarea id="message" name="message" rows="5" required class="w-full border border-gray-300 rounded px-3 py-2"></textarea>
        </div>
        <button type="submit" class="bg-blue-700 text-white px-6 py-3 rounded font-semibold hover:bg-blue-800 transition">Send Message</button>
      </form>
    </section>

    <section class="mb-8">
      <h2 class="text-2xl font-semibold mb-4">Our Location</h2>
      <div class="aspect-w-16 aspect-h-9">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019682927927!2d-122.4194150846813!3d37.77492977975944!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c5b1a1a1b%3A0x4a1a1a1a1a1a1a1a!2sSan%20Francisco%2C%20CA!5e0!3m2!1sen!2sus!4v1610000000000!5m2!1sen!2sus"
          width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
      </div>
      <p class="mt-4 text-gray-700">123 Security Lane, San Francisco, CA 94103</p>
      <p class="text-gray-700">Phone: (123) 456-7890</p>
      <p class="text-gray-700">Email: support@securecctv.com</p>
      <div class="flex space-x-4 mt-2">
        <a href="#" aria-label="Facebook" class="hover:text-blue-600"><i class="fab fa-facebook fa-lg"></i></a>
        <a href="#" aria-label="Twitter" class="hover:text-blue-400"><i class="fab fa-twitter fa-lg"></i></a>
        <a href="#" aria-label="Instagram" class="hover:text-pink-600"><i class="fab fa-instagram fa-lg"></i></a>
        <a href="#" aria-label="LinkedIn" class="hover:text-blue-700"><i class="fab fa-linkedin fa-lg"></i></a>
      </div>
    </section>
  </main>

  <footer class="bg-white border-t mt-16">
    <div class="container mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center text-gray-600 text-sm">
      <p>© 2024 SecureCCTV. All rights reserved.</p>
      <div class="space-x-4 mt-4 md:mt-0">
        <a href="#" aria-label="Facebook" class="hover:text-blue-600"><i class="fab fa-facebook fa-lg"></i></a>
        <a href="#" aria-label="Twitter" class="hover:text-blue-400"><i class="fab fa-twitter fa-lg"></i></a>
        <a href="#" aria-label="Instagram" class="hover:text-pink-600"><i class="fab fa-instagram fa-lg"></i></a>
        <a href="#" aria-label="LinkedIn" class="hover:text-blue-700"><i class="fab fa-linkedin fa-lg"></i></a>
      </div>
    </div>
  </footer>

  <script>
    // Mobile menu toggle
    const menuBtn = document.getElementById('menu-btn');
    const nav = document.querySelector('nav');
    menuBtn.addEventListener('click', () => {
      nav.classList.toggle('hidden');
    });

    // Contact form submission handler (demo only)
    const contactForm = document.getElementById('contact-form');
    contactForm.addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Thank you for contacting SecureCCTV. We will get back to you shortly.');
      contactForm.reset();
    });
  </script>
</body>
</html>
